<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The team logo (no text), in the ink that shows on the browser's own
         light or dark tab bar. -->
    <link
      rel="icon"
      href="https://static.igem.wiki/teams/6299/wiki/icons/logo-dark-purple-no-text.avif"
      type="image/avif"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="https://static.igem.wiki/teams/6299/wiki/icons/logo-light-purple-no-text.avif"
      type="image/avif"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMPOWER</title>
    <!-- Site-wide: this is one page that React fills in, and link previews
         (Instagram, LinkedIn, Slack) read this file without running it, so
         every page shares these. og:image is the wide logo still; some
         crawlers can't read AVIF, so swap in a PNG/JPG upload if a preview
         card comes up blank. -->
    <meta
      name="description"
      content="EMPOWER, the 2026 iGEM KU Leuven project on polyendocrine metabolic ovarian syndrome (PMOS): why we went looking for its roots in the gut, and the tools and therapeutics we built for it."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EMPOWER | iGEM KU Leuven 2026" />
    <meta property="og:title" content="EMPOWER | iGEM KU Leuven 2026" />
    <meta
      property="og:description"
      content="Why we went looking for the roots of PMOS in the gut, and the tools and therapeutics we built for it."
    />
    <meta
      property="og:image"
      content="https://static.igem.wiki/teams/6299/wiki/home-page/empower-logo-still-wide.avif"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
